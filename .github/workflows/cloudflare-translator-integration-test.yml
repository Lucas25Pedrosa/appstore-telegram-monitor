name: Cloudflare Translator Integration Test

on:
  push:
    paths:
      - ".github/workflows/cloudflare-translator-integration-test.yml"
  workflow_dispatch:

jobs:
  test-translator:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Core privado
        uses: actions/checkout@v6
        with:
          repository: Lucas25Pedrosa/appstore-telegram-core
          token: ${{ secrets.APPSTORE_CORE_TOKEN }}
          path: core

      - name: Instalar dependências
        run: python -m pip install requests langdetect

      - name: Testar função real do Monitor
        env:
          TRANSLATOR_API_KEY: ${{ secrets.TRANSLATOR_API_KEY }}
          TRANSLATOR_WORKER_URL: https://ipa-translator.f8s79jzkbk.workers.dev/
        shell: python
        run: |
          import importlib.util
          import pathlib
          import sys

          path = pathlib.Path("core/monitor.py")
          spec = importlib.util.spec_from_file_location("appstore_monitor", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          original = "Bug fixes and performance improvements."
          translated = module.traduzir_texto_cloudflare(
              original,
              "teste de integração Monitor",
              "en",
          )

          print(f"translated_text={translated}")

          if not translated or translated == original:
              print("❌ A função real do Monitor não traduziu o texto.")
              sys.exit(1)

          print("✅ Função real do Monitor validada.")
