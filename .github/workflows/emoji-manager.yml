name: Emoji Manager

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de execução"
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - app
          - preview
          - telegram-test
          - bulk-telegram
          - version-check-test
          - version-change-dry-run
          - add-app
          - delete-app
      app_id:
        description: "App Store ID"
        required: false
        type: string
      app_name:
        description: "Nome do app"
        required: false
        type: string
      bundle_id:
        description: "Bundle ID (obrigatório no version-check-test, add-app e delete-app)"
        required: false
        type: string
      request_id:
        description: "ID único da solicitação automática do /add ou /del"
        required: false
        type: string
      replace_existing:
        description: "Substituir o único emoji de teste existente no pack"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: emoji-manager-shared-config
  cancel-in-progress: false

jobs:
  backup-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar Core privado
        uses: actions/checkout@v6
        with:
          repository: Lucas25Pedrosa/appstore-telegram-core
          token: ${{ secrets.APPSTORE_CORE_TOKEN }}
          path: core
          fetch-depth: 1

      - name: Baixar configuração compartilhada
        uses: actions/checkout@v6
        with:
          repository: Lucas25Pedrosa/ipa-shared-config-core
          token: ${{ secrets.SHARED_CONFIG_WRITE_TOKEN }}
          path: shared-config
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Validar entrada
        env:
          MODE: ${{ inputs.mode }}
          APP_ID: ${{ inputs.app_id }}
          APP_NAME: ${{ inputs.app_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail

          if { [ "$MODE" = "app" ] || [ "$MODE" = "preview" ] || [ "$MODE" = "telegram-test" ] || [ "$MODE" = "version-check-test" ] || [ "$MODE" = "version-change-dry-run" ] || [ "$MODE" = "add-app" ]; } && [ -z "$APP_ID" ]; then
            echo "❌ app_id é obrigatório quando mode=$MODE"
            exit 1
          fi

          if [ "$MODE" = "version-check-test" ] || [ "$MODE" = "version-change-dry-run" ] || [ "$MODE" = "add-app" ] || [ "$MODE" = "delete-app" ]; then
            if [ -z "$APP_NAME" ]; then
              echo "❌ app_name é obrigatório quando mode=$MODE"
              exit 1
            fi

            if [ -z "$BUNDLE_ID" ]; then
              echo "❌ bundle_id é obrigatório quando mode=$MODE"
              exit 1
            fi
          fi

          if { [ "$MODE" = "add-app" ] || [ "$MODE" = "delete-app" ]; } && [ -z "$REQUEST_ID" ]; then
            echo "❌ request_id é obrigatório quando mode=$MODE"
            exit 1
          fi

      - name: Arquivar ícones originais
        if: ${{ inputs.mode != 'bulk-telegram' && inputs.mode != 'version-check-test' && inputs.mode != 'version-change-dry-run' && inputs.mode != 'add-app' && inputs.mode != 'delete-app' }}
        id: backup
        env:
          SHARED_CONFIG_DIR: ${{ github.workspace }}/shared-config
          MODE: ${{ inputs.mode }}
          APP_ID: ${{ inputs.app_id }}
          APP_NAME: ${{ inputs.app_name }}
          EMOJI_PREVIEW_DIR: ${{ github.workspace }}/emoji-preview
        run: |
          set -euo pipefail

          if [ "$MODE" = "bootstrap" ]; then
            python core/scripts/emoji_manager.py bootstrap
          else
            ARGS=("$MODE" --app-id "$APP_ID")
            if [ -n "$APP_NAME" ]; then
              ARGS+=(--app-name "$APP_NAME")
            fi
            python core/scripts/emoji_manager.py "${ARGS[@]}"
          fi

      - name: Criar primeiro custom emoji no Telegram
        if: ${{ inputs.mode == 'telegram-test' }}
        env:
          EMOJI_MANAGER_BOT_TOKEN: ${{ secrets.EMOJI_MANAGER_BOT_TOKEN }}
          EMOJI_MANAGER_OWNER_ID: ${{ secrets.EMOJI_MANAGER_OWNER_ID }}
        run: |
          set -euo pipefail
          mkdir -p emoji-telegram-result
          ARGS=(
            --image "${{ steps.backup.outputs.preview_file }}"
            --app-id "${{ inputs.app_id }}"
            --app-name "${{ inputs.app_name }}"
            --result "emoji-telegram-result/result.json"
          )

          if [ "${{ inputs.replace_existing }}" = "true" ]; then
            ARGS+=(--replace-existing)
          fi

          python core/scripts/telegram_emoji_manager.py "${ARGS[@]}"

      - name: Testar sincronização de ícone por versão
        if: ${{ inputs.mode == 'version-check-test' || inputs.mode == 'version-change-dry-run' }}
        env:
          SHARED_CONFIG_DIR: ${{ github.workspace }}/shared-config
          EMOJI_PREVIEW_DIR: ${{ github.workspace }}/emoji-preview
          EMOJI_MANAGER_BOT_TOKEN: ${{ secrets.EMOJI_MANAGER_BOT_TOKEN }}
          EMOJI_MANAGER_OWNER_ID: ${{ secrets.EMOJI_MANAGER_OWNER_ID }}
        run: |
          set -euo pipefail
          mkdir -p emoji-version-test

          ARGS=(
            --app-id "${{ inputs.app_id }}"
            --app-name "${{ inputs.app_name }}"
            --bundle-id "${{ inputs.bundle_id }}"
            --result "emoji-version-test/result.json"
          )

          if [ "${{ inputs.mode }}" = "version-change-dry-run" ]; then
            ARGS+=(--dry-run-change)
          fi

          python core/scripts/emoji_version_update.py "${ARGS[@]}"

      - name: Preservar estado do teste de versão
        if: ${{ always() && inputs.mode == 'version-check-test' }}
        working-directory: shared-config
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add custom_emojis.json app-icons/ .emoji-manager/

          if git diff --cached --quiet; then
            echo "✅ Nenhuma alteração do teste de versão para salvar."
            exit 0
          fi

          git commit -m "Validate Emoji Manager version icon state"
          git pull --rebase origin main
          git push origin main
          echo "✅ Estado do teste de versão salvo."

      - name: Publicar resultado do teste de versão
        if: ${{ always() && (inputs.mode == 'version-check-test' || inputs.mode == 'version-change-dry-run') }}
        uses: actions/upload-artifact@v7
        with:
          name: emoji-version-check-${{ inputs.app_id }}
          path: |
            emoji-version-test/result.json
            emoji-preview/*.png
            shared-config/.emoji-manager/pending/*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 1

      - name: Preparar emoji automático do /add
        if: ${{ inputs.mode == 'add-app' }}
        env:
          SHARED_CONFIG_DIR: ${{ github.workspace }}/shared-config
          EMOJI_PREVIEW_DIR: ${{ github.workspace }}/emoji-preview
          EMOJI_MANAGER_BOT_TOKEN: ${{ secrets.EMOJI_MANAGER_BOT_TOKEN }}
          EMOJI_MANAGER_OWNER_ID: ${{ secrets.EMOJI_MANAGER_OWNER_ID }}
        run: |
          set -euo pipefail

          python core/scripts/emoji_add_app.py prepare \
            --app-id "${{ inputs.app_id }}" \
            --app-name "${{ inputs.app_name }}" \
            --bundle-id "${{ inputs.bundle_id }}" \
            --request-id "${{ inputs.request_id }}"

      - name: Persistir pending do /add antes da mutação
        if: ${{ always() && inputs.mode == 'add-app' }}
        working-directory: shared-config
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app-icons/ .emoji-manager/ custom_emojis.json

          if git diff --cached --quiet; then
            echo "✅ Nenhum estado novo do /add para persistir antes da mutação."
            exit 0
          fi

          git commit -m "Prepare automatic app emoji"
          git pull --rebase origin main
          git push origin main

          echo "💾 Pending do emoji automático persistido antes da mutação."

      - name: Criar emoji automático do /add
        if: ${{ success() && inputs.mode == 'add-app' }}
        env:
          SHARED_CONFIG_DIR: ${{ github.workspace }}/shared-config
          EMOJI_PREVIEW_DIR: ${{ github.workspace }}/emoji-preview
          EMOJI_MANAGER_BOT_TOKEN: ${{ secrets.EMOJI_MANAGER_BOT_TOKEN }}
          EMOJI_MANAGER_OWNER_ID: ${{ secrets.EMOJI_MANAGER_OWNER_ID }}
        run: |
          set -euo pipefail

          python core/scripts/emoji_add_app.py apply \
            --app-id "${{ inputs.app_id }}" \
            --app-name "${{ inputs.app_name }}" \
            --bundle-id "${{ inputs.bundle_id }}" \
            --request-id "${{ inputs.request_id }}"

      - name: Persistir resultado do emoji automático
        if: ${{ always() && inputs.mode == 'add-app' }}
        working-directory: shared-config
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add custom_emojis.json app-icons/ .emoji-manager/

          if git diff --cached --quiet; then
            echo "✅ Nenhum resultado novo do emoji automático para salvar."
            exit 0
          fi

          git commit -m "Complete automatic app emoji"
          git pull --rebase origin main
          git push origin main

          echo "✅ Resultado do emoji automático salvo no shared-config."

      - name: Publicar diagnóstico do emoji automático
        if: ${{ always() && inputs.mode == 'add-app' }}
        uses: actions/upload-artifact@v7
        with:
          name: emoji-add-${{ inputs.request_id }}
          path: |
            shared-config/.emoji-manager/add-results/${{ inputs.request_id }}.json
            shared-config/.emoji-manager/pending-add/*.json
            emoji-preview/*.png
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 1

      - name: Preparar remoção automática do /del
        if: ${{ inputs.mode == 'delete-app' }}
        env:
          SHARED_CONFIG_DIR: ${{ github.workspace }}/shared-config
          EMOJI_MANAGER_BOT_TOKEN: ${{ secrets.EMOJI_MANAGER_BOT_TOKEN }}
          EMOJI_MANAGER_OWNER_ID: ${{ secrets.EMOJI_MANAGER_OWNER_ID }}
        run: |
          set -euo pipefail

          python core/scripts/emoji_del_app.py prepare \
            --app-name "${{ inputs.app_name }}" \
            --bundle-id "${{ inputs.bundle_id }}" \
            --request-id "${{ inputs.request_id }}"

      - name: Persistir pending do /del antes da mutação
        if: ${{ always() && inputs.mode == 'delete-app' }}
        working-directory: shared-config
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .emoji-manager/ custom_emojis.json

          if git diff --cached --quiet; then
            echo "✅ Nenhum estado novo do /del para persistir antes da mutação."
            exit 0
          fi

          git commit -m "Prepare automatic app emoji removal"
          git pull --rebase origin main
          git push origin main

          echo "💾 Pending da remoção automática persistido antes da mutação."

      - name: Remover emoji automático do /del
        if: ${{ success() && inputs.mode == 'delete-app' }}
        env:
          SHARED_CONFIG_DIR: ${{ github.workspace }}/shared-config
          EMOJI_MANAGER_BOT_TOKEN: ${{ secrets.EMOJI_MANAGER_BOT_TOKEN }}
          EMOJI_MANAGER_OWNER_ID: ${{ secrets.EMOJI_MANAGER_OWNER_ID }}
        run: |
          set -euo pipefail

          python core/scripts/emoji_del_app.py apply \
            --app-name "${{ inputs.app_name }}" \
            --bundle-id "${{ inputs.bundle_id }}" \
            --request-id "${{ inputs.request_id }}"

      - name: Persistir resultado da remoção automática
        if: ${{ always() && inputs.mode == 'delete-app' }}
        working-directory: shared-config
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add custom_emojis.json .emoji-manager/

          if git diff --cached --quiet; then
            echo "✅ Nenhum resultado novo da remoção automática para salvar."
            exit 0
          fi

          git commit -m "Complete automatic app emoji removal"
          git pull --rebase origin main
          git push origin main

          echo "✅ Resultado da remoção automática salvo no shared-config."

      - name: Publicar diagnóstico da remoção automática
        if: ${{ always() && inputs.mode == 'delete-app' }}
        uses: actions/upload-artifact@v7
        with:
          name: emoji-del-${{ inputs.request_id }}
          path: |
            shared-config/.emoji-manager/del-results/${{ inputs.request_id }}.json
            shared-config/.emoji-manager/pending-del/*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 1

      - name: Migrar pack oficial em lote
        if: ${{ inputs.mode == 'bulk-telegram' }}
        env:
          SHARED_CONFIG_DIR: ${{ github.workspace }}/shared-config
          EMOJI_PREVIEW_DIR: ${{ github.workspace }}/emoji-preview
          EMOJI_MANAGER_BOT_TOKEN: ${{ secrets.EMOJI_MANAGER_BOT_TOKEN }}
          EMOJI_MANAGER_OWNER_ID: ${{ secrets.EMOJI_MANAGER_OWNER_ID }}
        run: |
          set -euo pipefail
          python core/scripts/telegram_emoji_bulk.py --seed-app-id 389801252

      - name: Preservar estado da migração no shared-config
        if: ${{ always() && inputs.mode == 'bulk-telegram' }}
        working-directory: shared-config
        run: |
          set -euo pipefail

          if [ ! -d .emoji-manager ]; then
            echo "ℹ️ Nenhum estado de migração foi gerado."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .emoji-manager/

          if git diff --cached --quiet; then
            echo "✅ Estado da migração já está atualizado."
            exit 0
          fi

          git commit -m "Save Emoji Manager bulk migration state"
          git pull --rebase origin main
          git push origin main
          echo "💾 Estado da migração preservado para retomada."

      - name: Promover custom_emojis para produção
        if: ${{ success() && inputs.mode == 'bulk-telegram' }}
        working-directory: shared-config
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Garante que a validação use o estado mais recente do repositório.
          git pull --rebase origin main

          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path(".")
          apps_path = root / "apps.json"
          active_path = root / "custom_emojis.json"
          state_path = root / ".emoji-manager" / "bulk_state.json"
          next_path = root / ".emoji-manager" / "custom_emojis.next.json"

          for path in (apps_path, active_path, state_path, next_path):
              if not path.is_file():
                  raise SystemExit(f"❌ Arquivo obrigatório ausente: {path}")

          apps = json.loads(apps_path.read_text(encoding="utf-8"))
          active = json.loads(active_path.read_text(encoding="utf-8"))
          state = json.loads(state_path.read_text(encoding="utf-8"))
          proposed = json.loads(next_path.read_text(encoding="utf-8"))

          if not isinstance(apps, list):
              raise SystemExit("❌ apps.json precisa conter uma lista.")
          if not isinstance(active, dict):
              raise SystemExit("❌ custom_emojis.json ativo é inválido.")
          if not isinstance(proposed, dict):
              raise SystemExit("❌ custom_emojis.next.json é inválido.")
          if not isinstance(state, dict):
              raise SystemExit("❌ bulk_state.json é inválido.")

          if state.get("complete") is not True:
              raise SystemExit("❌ Migração não está marcada como complete=true.")

          state_apps = state.get("apps")
          if not isinstance(state_apps, dict):
              raise SystemExit("❌ bulk_state.json não contém apps válidos.")

          expected_ids = set()
          for item in apps:
              if not isinstance(item, dict):
                  continue
              try:
                  expected_ids.add(str(int(item.get("id"))))
              except (TypeError, ValueError):
                  continue

          if not expected_ids:
              raise SystemExit("❌ Nenhum App Store ID válido em apps.json.")

          state_ids = set(state_apps.keys())
          if state_ids != expected_ids:
              missing = sorted(expected_ids - state_ids)
              extra = sorted(state_ids - expected_ids)
              raise SystemExit(
                  "❌ Estado em lote não corresponde ao apps.json. "
                  f"Ausentes={missing} Extras={extra}"
              )

          for app_id, item in state_apps.items():
              if not isinstance(item, dict):
                  raise SystemExit(f"❌ Estado inválido para App Store ID {app_id}.")
              if item.get("status") != "done":
                  raise SystemExit(
                      f"❌ App Store ID {app_id} não está concluído: "
                      f"{item.get('status')!r}"
                  )

              bundle_id = str(item.get("bundle_id") or "").strip()
              emoji_id = str(item.get("custom_emoji_id") or "").strip()
              if not bundle_id or not emoji_id:
                  raise SystemExit(
                      f"❌ Bundle ID/custom_emoji_id ausente para App Store ID {app_id}."
                  )

              entry = proposed.get(bundle_id)
              if not isinstance(entry, dict):
                  raise SystemExit(
                      f"❌ {bundle_id} não existe no custom_emojis.next.json."
                  )

              proposed_id = str(entry.get("custom_emoji_id") or "").strip()
              if proposed_id != emoji_id:
                  raise SystemExit(
                      f"❌ ID divergente para {bundle_id}: "
                      f"estado={emoji_id} next={proposed_id}"
                  )

          # Toda entrada explicitamente protegida precisa sobreviver idêntica.
          for key, value in active.items():
              if isinstance(value, dict) and value.get("managed") is False:
                  if proposed.get(key) != value:
                      raise SystemExit(
                          f"❌ Entrada protegida foi alterada no next JSON: {key}"
                      )

          active_bytes = active_path.read_bytes()
          next_bytes = next_path.read_bytes()

          if active_bytes == next_bytes:
              print("✅ custom_emojis.json já está promovido; nenhuma troca necessária.")
          else:
              backup_dir = root / ".emoji-manager" / "backups"
              backup_dir.mkdir(parents=True, exist_ok=True)

              run_id = str(os.environ.get("RUN_ID") or "manual").strip()
              backup_path = backup_dir / f"custom_emojis.pre-bulk-{run_id}.json"

              if not backup_path.exists():
                  shutil.copy2(active_path, backup_path)
                  print(f"💾 Backup criado: {backup_path}")
              else:
                  print(f"ℹ️ Backup desta execução já existe: {backup_path}")

              active_path.write_bytes(next_bytes)
              print(
                  "✅ custom_emojis.next.json promovido para custom_emojis.json "
                  f"({len(state_apps)} apps validados)."
              )
          PY

          git add custom_emojis.json .emoji-manager/

          if git diff --cached --quiet; then
            echo "✅ Produção já estava sincronizada; nenhum commit necessário."
            exit 0
          fi

          git commit -m "Promote Emoji Manager custom emoji IDs"
          git pull --rebase origin main
          git push origin main
          echo "🚀 custom_emojis.json promovido com sucesso."

      - name: Publicar resultado da migração em lote
        if: ${{ always() && inputs.mode == 'bulk-telegram' }}
        uses: actions/upload-artifact@v7
        with:
          name: emoji-bulk-migration
          path: |
            shared-config/.emoji-manager/*.json
            emoji-preview/*.png
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: Publicar resultado do teste Telegram
        if: ${{ inputs.mode == 'telegram-test' }}
        uses: actions/upload-artifact@v7
        with:
          name: emoji-telegram-test-${{ inputs.app_id }}
          path: |
            emoji-preview/*.png
            emoji-telegram-result/result.json
          if-no-files-found: error
          retention-days: 1

      - name: Publicar preview 100x100
        if: ${{ inputs.mode == 'preview' }}
        uses: actions/upload-artifact@v7
        with:
          name: emoji-preview-${{ inputs.app_id }}
          path: emoji-preview/*.png
          if-no-files-found: error
          retention-days: 1

      - name: Salvar backup no ipa-shared-config-core
        if: ${{ inputs.mode != 'preview' && inputs.mode != 'telegram-test' && inputs.mode != 'bulk-telegram' && inputs.mode != 'version-check-test' && inputs.mode != 'version-change-dry-run' && inputs.mode != 'add-app' && inputs.mode != 'delete-app' }}
        working-directory: shared-config
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app-icons/ custom_emojis.json

          if git diff --cached --quiet; then
            echo "✅ Nenhum ícone ou hash novo para salvar."
            exit 0
          fi

          git commit -m "Backup App Store icons and hashes"
          git pull --rebase origin main
          git push origin main
          echo "✅ Backup dos ícones e hashes salvo no ipa-shared-config-core."
