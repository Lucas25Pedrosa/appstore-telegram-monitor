name: Emoji Manager

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de execução"
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - app
          - preview
          - telegram-test
          - bulk-telegram
      app_id:
        description: "App Store ID (obrigatório nos modos app, preview e telegram-test)"
        required: false
        type: string
      app_name:
        description: "Nome do app (opcional; usado para a pasta)"
        required: false
        type: string
      replace_existing:
        description: "Substituir o único emoji de teste existente no pack"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: emoji-manager-shared-config
  cancel-in-progress: false

jobs:
  backup-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar Core privado
        uses: actions/checkout@v6
        with:
          repository: Lucas25Pedrosa/appstore-telegram-core
          token: ${{ secrets.APPSTORE_CORE_TOKEN }}
          path: core
          fetch-depth: 1

      - name: Baixar configuração compartilhada
        uses: actions/checkout@v6
        with:
          repository: Lucas25Pedrosa/ipa-shared-config-core
          token: ${{ secrets.SHARED_CONFIG_WRITE_TOKEN }}
          path: shared-config
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Validar entrada
        env:
          MODE: ${{ inputs.mode }}
          APP_ID: ${{ inputs.app_id }}
        run: |
          set -euo pipefail
          if { [ "$MODE" = "app" ] || [ "$MODE" = "preview" ] || [ "$MODE" = "telegram-test" ]; } && [ -z "$APP_ID" ]; then
            echo "❌ app_id é obrigatório quando mode=$MODE"
            exit 1
          fi

      - name: Arquivar ícones originais
        if: ${{ inputs.mode != 'bulk-telegram' }}
        id: backup
        env:
          SHARED_CONFIG_DIR: ${{ github.workspace }}/shared-config
          MODE: ${{ inputs.mode }}
          APP_ID: ${{ inputs.app_id }}
          APP_NAME: ${{ inputs.app_name }}
          EMOJI_PREVIEW_DIR: ${{ github.workspace }}/emoji-preview
        run: |
          set -euo pipefail

          if [ "$MODE" = "bootstrap" ]; then
            python core/scripts/emoji_manager.py bootstrap
          else
            ARGS=("$MODE" --app-id "$APP_ID")
            if [ -n "$APP_NAME" ]; then
              ARGS+=(--app-name "$APP_NAME")
            fi
            python core/scripts/emoji_manager.py "${ARGS[@]}"
          fi

      - name: Criar primeiro custom emoji no Telegram
        if: ${{ inputs.mode == 'telegram-test' }}
        env:
          EMOJI_MANAGER_BOT_TOKEN: ${{ secrets.EMOJI_MANAGER_BOT_TOKEN }}
          EMOJI_MANAGER_OWNER_ID: ${{ secrets.EMOJI_MANAGER_OWNER_ID }}
        run: |
          set -euo pipefail
          mkdir -p emoji-telegram-result
          ARGS=(
            --image "${{ steps.backup.outputs.preview_file }}"
            --app-id "${{ inputs.app_id }}"
            --app-name "${{ inputs.app_name }}"
            --result "emoji-telegram-result/result.json"
          )

          if [ "${{ inputs.replace_existing }}" = "true" ]; then
            ARGS+=(--replace-existing)
          fi

          python core/scripts/telegram_emoji_manager.py "${ARGS[@]}"

      - name: Migrar pack oficial em lote
        if: ${{ inputs.mode == 'bulk-telegram' }}
        env:
          SHARED_CONFIG_DIR: ${{ github.workspace }}/shared-config
          EMOJI_PREVIEW_DIR: ${{ github.workspace }}/emoji-preview
          EMOJI_MANAGER_BOT_TOKEN: ${{ secrets.EMOJI_MANAGER_BOT_TOKEN }}
          EMOJI_MANAGER_OWNER_ID: ${{ secrets.EMOJI_MANAGER_OWNER_ID }}
        run: |
          set -euo pipefail
          python core/scripts/telegram_emoji_bulk.py --seed-app-id 389801252

      - name: Preservar estado da migração no shared-config
        if: ${{ always() && inputs.mode == 'bulk-telegram' }}
        working-directory: shared-config
        run: |
          set -euo pipefail

          if [ ! -d .emoji-manager ]; then
            echo "ℹ️ Nenhum estado de migração foi gerado."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .emoji-manager/

          if git diff --cached --quiet; then
            echo "✅ Estado da migração já está atualizado."
            exit 0
          fi

          git commit -m "Save Emoji Manager bulk migration state"
          git pull --rebase origin main
          git push origin main
          echo "💾 Estado da migração preservado para retomada."

      - name: Publicar resultado da migração em lote
        if: ${{ always() && inputs.mode == 'bulk-telegram' }}
        uses: actions/upload-artifact@v4
        with:
          name: emoji-bulk-migration
          path: |
            shared-config/.emoji-manager/*.json
            emoji-preview/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar resultado do teste Telegram
        if: ${{ inputs.mode == 'telegram-test' }}
        uses: actions/upload-artifact@v4
        with:
          name: emoji-telegram-test-${{ inputs.app_id }}
          path: |
            emoji-preview/*.png
            emoji-telegram-result/result.json
          if-no-files-found: error
          retention-days: 1

      - name: Publicar preview 100x100
        if: ${{ inputs.mode == 'preview' }}
        uses: actions/upload-artifact@v4
        with:
          name: emoji-preview-${{ inputs.app_id }}
          path: emoji-preview/*.png
          if-no-files-found: error
          retention-days: 1

      - name: Salvar backup no ipa-shared-config-core
        if: ${{ inputs.mode != 'preview' && inputs.mode != 'telegram-test' && inputs.mode != 'bulk-telegram' }}
        working-directory: shared-config
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app-icons/ custom_emojis.json

          if git diff --cached --quiet; then
            echo "✅ Nenhum ícone ou hash novo para salvar."
            exit 0
          fi

          git commit -m "Backup App Store icons and hashes"
          git pull --rebase origin main
          git push origin main
          echo "✅ Backup dos ícones e hashes salvo no ipa-shared-config-core."
